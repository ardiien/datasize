[versions]
bcv = "0.18.1"
dokka = "2.2.0"
kotlin = "2.4.0"
kotlinCollections = "0.5.0"
shadow = "9.4.1"
publish = "0.36.0"

[libraries]
kotlinx-collections = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinCollections" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
bcv = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
mcentral-publish = { id = "com.vanniktech.maven.publish", version.ref = "publish" }
